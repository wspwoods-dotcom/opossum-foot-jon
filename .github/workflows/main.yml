name: Unzip upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip app files
        run: |
          unzip -o jon-cook-clone.zip
          rm -f jon-cook-clone.zip
          rm -rf __MACOSX
      - name: Flatten single top-level folder if present
        run: |
          if [ ! -f index.html ]; then
            for d in */; do
              if [ -f "$d/index.html" ]; then
                shopt -s dotglob
                mv "$d"* .
                rmdir "$d"
              fi
            done
          fi
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "wspwoods-dotcom"
          git config user.email "wspwoods-dotcom@users.noreply.github.com"
          git add -A
          git commit -m "Upload Jon Cook test copy of Opossum Foot app" || echo "nothing to commit"
          git push
